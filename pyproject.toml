[project]
name = "pdf-book-exporter"
version = "2.0.0"
description = "Export a Hugo book (page bundles + front matter) to PDF via Pandoc and Typst"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jimmy Song", email = "rootsongjc@gmail.com" }]
requires-python = ">=3.10"
keywords = ["hugo", "pdf", "typst", "pandoc", "ebook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Printing",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/rootsongjc/pdf-book-exporter"

[project.scripts]
pdf-book-exporter = "pdf_book_exporter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_book_exporter"]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
