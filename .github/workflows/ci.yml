name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pandoc and typst
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          curl -sSL https://github.com/jgm/pandoc/releases/download/3.6.4/pandoc-3.6.4-1-amd64.deb -o pandoc.deb
          sudo dpkg -i pandoc.deb
          curl -sSL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
      - run: uv sync
      - run: uv run pdf-book-exporter --check
      - run: uv run pytest -q
      - run: uv run pdf-book-exporter example -o example.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: example-pdf
          path: example.pdf
